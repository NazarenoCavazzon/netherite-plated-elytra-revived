org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Version objetivo del build (por defecto: la del pack, 26.2).
# Para compilar para otra version (p.ej. 26.1.2) sobreescribir con -P, sin tocar archivos:
#   "$GRADLE" clean build \
#     -Pminecraft_version=26.1.2 \
#     -Pfabric_api_version=0.155.3+26.1.2 \
#     -Pmod_version=1.0.0+26.1.2
minecraft_version=26.2
fabric_api_version=0.160.0+26.2
mod_version=1.0.0+26.2
